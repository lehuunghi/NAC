name: NAC20 Debian 12 installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Debian packages in the Linux builder
        shell: bash
        env:
          BUILDER_IMAGE: ghcr.io/inverse-inc/packetfence/pfbuild-debian-bookworm:latest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nac20-output"
          docker pull "$BUILDER_IMAGE"
          BUILDER_DIGEST=$(docker image inspect "$BUILDER_IMAGE" --format '{{index .RepoDigests 0}}')
          docker run --rm \
            -e NAC20_COMMIT="$GITHUB_SHA" \
            -e NAC20_BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
            -e NAC20_BUILDER_DIGEST="$BUILDER_DIGEST" \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/nac20-output:/out" \
            "$BUILDER_DIGEST" \
            bash /source/packaging/debian12/build.sh \
            2>&1 | tee "$RUNNER_TEMP/nac20-output/build.log"
      - name: Upload installation bundle
        uses: actions/upload-artifact@v4
        with:
          name: nac20-debian12-amd64
          path: |
            ${{ runner.temp }}/nac20-output/*.tar.gz
            ${{ runner.temp }}/nac20-output/SHA256SUMS
            ${{ runner.temp }}/nac20-output/BUILDINFO.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nac20-build-log
          path: ${{ runner.temp }}/nac20-output/build.log
          retention-days: 7
