name: NAC20 Security foundation
on:
  pull_request:
    paths:
      - 'addons/nac20-security/**'
      - '.github/workflows/nac20-security.yml'
  push:
    branches: ['codex/nac20-security-foundation']
    paths:
      - 'addons/nac20-security/**'
      - '.github/workflows/nac20-security.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - run: python -m unittest discover -s addons/nac20-security -v
